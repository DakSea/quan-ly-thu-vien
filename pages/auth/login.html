<body data-area="auth" data-page="login">
  <a class="skip-link" href="#main">Đến nội dung chính</a>
  <header id="header" class="site-header"></header>
  <main id="main" class="container"><section class="auth-layout"><p id="notice" role="alert" hidden></p><p class="eyebrow">Tài khoản thư viện</p><h1>Đăng nhập</h1><p class="muted">Đăng nhập để mượn sách, gửi yêu cầu trả và xem lịch sử của bạn.</p><form id="login-form" class="form editor"><label>Tên đăng nhập hoặc email<input name="username" required autocomplete="username" maxlength="150"></label><label>Mật khẩu<input name="password" type="password" required autocomplete="current-password"></label><button type="submit">Đăng nhập</button><p class="form-message" role="alert" hidden></p></form><p>Chưa có tài khoản? <a id="auth-switch" href="register.html">Đăng ký ngay</a></p><a href="../../index.html">← Về trang chủ</a><noscript>Vui lòng bật JavaScript để sử dụng tài khoản.</noscript></section></main>
  <footer id="footer" class="site-footer"></footer>
</body>
