<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thông tin khách hàng | Book Library</title>
  <link rel="stylesheet" href="../../css/style.css">
  <script src="../../js/data.js" defer></script>
  <script src="../../js/store.js" defer></script>
  <script src="../../js/common.js" defer></script>
  <script src="../../js/admin.js" defer></script>
</head>
<body data-page="admin-user">
  <a class="skip-link" href="#main">Đến nội dung chính</a>
  <header id="header" class="site-header"></header>
  <main id="main" class="container">
    <p id="notice" role="alert" hidden></p>
    <div id="content">
      <a href="users.html">← Danh sách khách hàng</a><div class="section-heading"><h1>Thông tin khách hàng</h1></div>
      <p class="muted">Tên đăng nhập: <span id="customer-name"></span></p>
      <form id="user-form" class="form form-section">
        <label>Họ tên<input type="text" name="name" maxlength="100" autocomplete="name" required></label>
        <label>Email<input type="email" name="email" autocomplete="email" required></label>
        <label>Điện thoại<input type="tel" name="phone" autocomplete="tel" ></label>
        <label>Địa chỉ<input type="text" name="address" maxlength="300" autocomplete="street-address" ></label>
        <div><button type="submit">Lưu thông tin</button></div><p class="form-message" role="status" hidden></p>
      </form>
    </div>
    <noscript>Vui lòng bật JavaScript để sử dụng dữ liệu mẫu và các thao tác trên trang.</noscript>
  </main>
  <footer id="footer" class="site-footer"></footer>
</body>
</html>
