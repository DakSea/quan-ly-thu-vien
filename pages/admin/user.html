<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thông tin người dùng | Quản lý thư viện</title>
  <link rel="stylesheet" href="../../css/style.css">
  <script src="../../js/data.js" defer></script>
  <script src="../../js/store.js" defer></script>
  <script src="../../js/common.js" defer></script>
  <script src="../../js/admin.js" defer></script>
</head>
<body data-area="admin" data-require="admin" data-page="admin-user">
  <a class="skip-link" href="#main">Đến nội dung chính</a>
  <header id="header" class="site-header"></header>
  <main id="main" class="container">
    <p id="notice" role="alert" hidden></p>
    <div id="content">
      <a href="users.html">← Danh sách người dùng</a>
      <div class="section-heading"><h1>Thông tin người dùng</h1></div>
      <p class="muted">Mã người dùng: <strong id="reader-code"></strong></p>
      <form id="user-form" class="form form-section">
        <label>Họ và tên<input type="text" name="name" maxlength="100" autocomplete="name" required></label>
        <label>Email<input type="email" name="email" maxlength="150" autocomplete="email" required></label>
        <label>Điện thoại<input type="tel" name="phone" maxlength="30" autocomplete="tel"></label>
        <label>Địa chỉ<input type="text" name="address" maxlength="300" autocomplete="street-address"></label>
        <div><button type="submit">Lưu thông tin</button></div>
        <p class="form-message" role="status" hidden></p>
      </form>
    </div>
    <noscript>Vui lòng bật JavaScript để sử dụng hệ thống quản lý thư viện.</noscript>
  </main>
  <footer id="footer" class="site-footer"></footer>
</body>
</html>
