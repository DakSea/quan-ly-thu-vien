<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý danh mục | Book Library</title>
  <link rel="stylesheet" href="../../css/style.css">
  <script src="../../js/data.js" defer></script>
  <script src="../../js/store.js" defer></script>
  <script src="../../js/common.js" defer></script>
  <script src="../../js/admin.js" defer></script>
</head>
<body data-page="admin-categories">
  <a class="skip-link" href="#main">Đến nội dung chính</a>
  <header id="header" class="site-header"></header>
  <main id="main" class="container">
    <p id="notice" role="alert" hidden></p>
    <div id="content">
      <h1>Quản lý danh mục</h1>
      <div class="toolbar"><label>Tìm danh mục<input id="admin-search" type="search" placeholder="Nhập tên danh mục"></label></div>
      <div id="admin-list"></div>
      <section class="editor form-section"><h2 id="named-title">Thêm danh mục</h2>
        <form id="named-form" class="form"><input type="hidden" name="id">
          <label>Tên danh mục<input type="text" name="name" maxlength="100" required></label>
          <div class="actions"><button type="submit">Lưu</button><button type="button" id="cancel-edit" class="secondary">Hủy chỉnh sửa</button></div><p class="form-message" role="status" hidden></p>
        </form>
      </section>
    </div>
    <noscript>Vui lòng bật JavaScript để sử dụng dữ liệu mẫu và các thao tác trên trang.</noscript>
  </main>
  <footer id="footer" class="site-footer"></footer>
</body>
</html>
