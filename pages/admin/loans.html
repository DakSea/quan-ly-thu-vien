<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý mượn – trả | Quản lý thư viện</title>
  <link rel="stylesheet" href="../../css/style.css">
  <script src="../../js/data.js" defer></script>
  <script src="../../js/store.js" defer></script>
  <script src="../../js/common.js" defer></script>
  <script src="../../js/admin.js" defer></script>

<body data-area="admin" data-require="admin" data-page="admin-loans">
  <a class="skip-link" href="#main">Đến nội dung chính</a>
  <header id="header" class="site-header"></header>
  <main id="main" class="container">
    <p id="notice" role="alert" hidden></p>
    <div id="content">
      <h1>Mượn – trả sách</h1>
      <div class="toolbar">
        <label>Tìm phiếu<input id="admin-search" type="search" placeholder="Mã phiếu, tên người dùng hoặc sách"></label>
        <label>Trạng thái<select id="loan-status">
          <option value="">Tất cả trạng thái</option>
          <option>Đang mượn</option>
          <option>Đã trả</option>
          <option>Quá hạn</option>
        </select></label>
      </div>
      <div id="admin-list"></div>
    </div>
    <noscript>Vui lòng bật JavaScript để sử dụng hệ thống quản lý thư viện.</noscript>
  </main>
  <footer id="footer" class="site-footer"></footer>

</html>
